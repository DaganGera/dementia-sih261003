[project]
name = "hillpath-ml"
version = "0.1.0"
description = "Hillpath M2 staging pipeline. Trains on simulator output only; every artefact is tagged Simulated."
requires-python = ">=3.12"
dependencies = [
  "numpy==2.5.3",
  "pandas==3.0.6",
  "scipy>=1.14",
  "statsmodels==0.15.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.8"]
# Only m2_candidates.py needs these. The main pipeline (m2lib.py, m2_train.py) and its tests do not.
candidates = [
  "interpret-core>=0.7.8",
  "lightgbm>=4.7.0",
  "onnxmltools>=1.16.0",
  "onnxruntime>=1.30.0",
  "skl2onnx>=1.20.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
