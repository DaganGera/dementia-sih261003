[project]
name = "hillpath-ml"
version = "0.1.0"
description = "Hillpath M2 staging pipeline. Trains on simulator output only; every artefact is tagged Simulated."
requires-python = ">=3.12"
dependencies = [
  "numpy==2.5.3",
  "pandas==3.0.6",
  "scipy>=1.14",
  "statsmodels==0.15.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.8"]

[tool.uv]
package = false

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
