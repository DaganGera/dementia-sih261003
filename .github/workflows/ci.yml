name: ci

on:
  push:
  pull_request:

env:
  SITE_ORIGIN: http://localhost:4174
  APP_URL: http://localhost:4173/

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:tools
      - run: pnpm check:avoid
      - run: uv sync --project ml
      - run: uv run --project ml ruff check ml
      - run: uv run --project ml python -W ignore -m pytest -q ml

  e2e:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter app build
      - run: pnpm --filter landing build
      - run: pnpm --filter app exec playwright install --with-deps chromium
      - run: pnpm --filter app e2e
      - run: pnpm --filter landing e2e
